services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: onward
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - postgres_network

  mailpit:
    image: axllent/mailpit:v1.28
    container_name: onward-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: onward-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    container_name: onward-redis
    ports:
      - "6379:6379"

  # Go Notification service: consumes onward.auth from RabbitMQ, sends through Mailpit.
  # Same binary as `go run ./cmd/notification`; only the hostnames differ from the local defaults.
  # It exits on infrastructure errors by design and relies on the restart policy.
  notification:
    build: ../onward-notification
    container_name: onward-notification
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      REDIS_ADDR: redis:6379
      FRONTEND_BASE_URL: http://localhost:5173
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

networks:
  postgres_network:
    
