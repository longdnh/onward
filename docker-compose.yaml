services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: onward
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - postgres_network

  mailpit:
    image: axllent/mailpit:v1.28
    container_name: onward-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

networks:
  postgres_network:
    
