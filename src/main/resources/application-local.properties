# Enable with --spring.profiles.active=local for localhost HTTP development only.
app.security.csrf.secure-cookie=false

app.auth.jwt-private-key=file:${user.home}/.config/donot-get-left-behind/jwt/private.pem
app.auth.jwt-public-key=file:${user.home}/.config/donot-get-left-behind/jwt/public.pem
# First system admin: an already registered email that is promoted at startup when no admin exists yet.
app.bootstrap.system-admin-email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
