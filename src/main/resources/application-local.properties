# Enable with --spring.profiles.active=local for localhost HTTP development only.
app.security.csrf.secure-cookie=false

app.auth.jwt-private-key=file:${user.home}/.config/onward/jwt/private.pem
app.auth.jwt-public-key=file:${user.home}/.config/onward/jwt/public.pem
# First system admin: an already registered email that is promoted at startup when no admin exists yet.
app.bootstrap.system-admin-email=${APP_BOOTSTRAP_ADMIN_EMAIL:}

# Mail delivery. "smtp" sends from this process through Mailpit (SMTP 1025, web UI http://localhost:8025).
# "rabbit" publishes the auth event to RabbitMQ (AMQP 5672, web UI http://localhost:15672, guest/guest) for
# the Go Notification service, which then sends through Mailpit itself.
app.mail.mode=rabbit
spring.mail.host=localhost
spring.mail.port=1025
