spring.application.name=onward
app.auth.access-token-lifetime=5m
app.auth.idle-timeout=30m
app.auth.absolute-lifetime=12h
app.auth.email-verification-token-lifetime=24h
app.auth.password-reset-token-lifetime=30m
app.auth.email-resend-cooldown=60s

# Mail: "log" prints mails to the application log; "smtp" sends via spring.mail.* (see the local profile).
app.mail.mode=log
app.mail.from=no-reply@onward.local
app.mail.frontend-base-url=http://localhost:3000

app.auth.issuer=onward
app.auth.audience=onward-api
spring.jpa.open-in-view=false