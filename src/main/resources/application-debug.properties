# Run with --spring.profiles.active=local,debug (or the "Spring Boot - Local + debug logging" launch config)
# to watch one request walk through Account. See docs/en/debugging.md.

# Spring Security: which filter runs for the request, authentication outcome, 401/403 decisions.
logging.level.org.springframework.security=DEBUG
# Every filter in the chain, in order, for every request.
logging.level.org.springframework.security.web.FilterChainProxy=TRACE
# SQL sent to PostgreSQL and the bound parameter values.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Our own code.
logging.level.com.longdnh.onward=DEBUG
